  <line x1="80" y1="230" x2="576" y2="230" stroke="var(--color-border-tertiary)" stroke-width="0.5" stroke-dasharray="2 4"/>
  <text x="75" y="234" text-anchor="end" class="ts" fill="var(--color-text-tertiary)">0.5</text>

  <text x="75" y="384" text-anchor="end" class="ts" fill="var(--color-text-tertiary)">0.0</text>

  <polyline points="80,108 96,109 112,124 128,122 144,131 160,124 176,126 192,122 208,164 224,126 240,153 256,155 272,152 288,142 304,208 320,213 336,253 352,248 368,245 384,153 400,243 416,204 432,238 448,190 464,224 480,212 496,330 512,210 528,286 544,288" fill="none" stroke="var(--c-coral-400)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polyline points="80,108 96,109 112,124 128,122 144,131 160,124 176,126 192,122 208,164 224,126 240,153 256,155 272,149 288,136 304,199 320,201 336,238 352,230 368,224 384,129 400,215 416,173 432,204 448,153 464,185 480,169 496,284 512,161 528,234 544,233" fill="none" stroke="var(--c-blue-600)" stroke-width="2"/>

