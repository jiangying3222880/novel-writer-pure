  <text x="340" y="68" text-anchor="middle" class="ts">Dashed red = before, Solid blue = after | is_stable=False</text>

  <line x1="80" y1="80" x2="80" y2="380" stroke="var(--color-border-secondary)" stroke-width="0.5"/>
