#sidebar .close { position: absolute; top: 12px; right: 12px; background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }
#legend { position: fixed; left: 12px; bottom: 12px; background: #111827ee; border: 1px solid #1f2937; border-radius: 8px; padding: 12px; z-index: 50; }
#legend h3 { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }

#title { position: fixed; left: 12px; top: 12px; z-index: 50; }
#title h1 { font-size: 18px; color: #e2e8f0; }
#title p { font-size: 12px; color: #64748b; }
#search { position: fixed; left: 12px; top: 60px; z-index: 50; }
#search input { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 6px 12px; border-radius: 6px; width: 200px; font-size: 12px; }
</style>

<svg id="graph"></svg>

// ============================================================
// D3.js 力导向图
// ============================================================
const width = window.innerWidth;
const height = window.innerHeight;

const layerColors = {
  core: "#8b5cf6",
  service: "#22c55e",
  story: "#3b82f6",
  agent: "#ef4444",
  knowledge: "#f59e0b",
  ui: "#6366f1"
};

const layerY = { core: 80, knowledge: 200, service: 350, story: 500, agent: 650, ui: 800 };

// 初始化节点位置
modules.forEach(m => {
  m.x = width / 2 + (Math.random() - 0.5) * 600;
  m.y = layerY[m.layer] + (Math.random() - 0.5) * 80;
  m.vx = 0;
  m.vy = 0;
});

const nodeMap = {};
modules.forEach(m => nodeMap[m.id] = m);

const svg = document.getElementById("graph");
svg.setAttribute("width", width);
svg.setAttribute("height", height);

// 绘制连线
const linkGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
svg.appendChild(linkGroup);

edges.forEach(([src, tgt]) => {
  if (!nodeMap[src] || !nodeMap[tgt]) return;
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line.classList.add("link");
  line.setAttribute("stroke", "#334155");
  line.setAttribute("stroke-width", "1");
  line.dataset.source = src;
  line.dataset.target = tgt;
  linkGroup.appendChild(line);
});

// 绘制节点
const nodeGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
svg.appendChild(nodeGroup);

modules.forEach(m => {
  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.classList.add("node");
  g.dataset.id = m.id;

  const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  circle.setAttribute("r", "8");
  circle.setAttribute("fill", layerColors[m.layer]);
  circle.setAttribute("stroke", "#0a0a1a");
  circle.setAttribute("stroke-width", "2");
  g.appendChild(circle);

  const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
  text.classList.add("node-label");
  text.setAttribute("dy", "20");
  text.textContent = m.label;
  g.appendChild(text);

  g.addEventListener("click", () => showSidebar(m));
  nodeGroup.appendChild(g);
});

// ============================================================
// 力导向模拟
// ============================================================
let running = true;
function tick() {
  if (!running) return;

  // 斥力
  for (let i = 0; i < modules.length; i++) {
    for (let j = i + 1; j < modules.length; j++) {
      const a = modules[i], b = modules[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let dist = Math.sqrt(dx * dx + dy * dy) || 1;
      let force = 800 / (dist * dist);
      let fx = dx / dist * force, fy = dy / dist * force;
      a.vx -= fx; a.vy -= fy;
      b.vx += fx; b.vy += fy;
    }
  }

  // 连线引力
  edges.forEach(([src, tgt]) => {
    const a = nodeMap[src], b = nodeMap[tgt];
    if (!a || !b) return;
    let dx = b.x - a.x, dy = b.y - a.y;
    let dist = Math.sqrt(dx * dx + dy * dy) || 1;
    let force = (dist - 120) * 0.005;
    let fx = dx / dist * force, fy = dy / dist * force;
    a.vx += fx; a.vy += fy;
    b.vx -= fx; b.vy -= fy;
  });

  // 层级引力 (向目标 y 靠拢)
  modules.forEach(m => {
    m.vy += (layerY[m.layer] - m.y) * 0.003;
  });

  // 中心引力
  modules.forEach(m => {
    m.vx += (width / 2 - m.x) * 0.0005;
    m.vy += (height / 2 - m.y) * 0.0005;
  });

  // 更新位置
  modules.forEach(m => {
    m.vx *= 0.85;
    m.vy *= 0.85;
    m.x += m.vx;
    m.y += m.vy;
    m.x = Math.max(30, Math.min(width - 30, m.x));
    m.y = Math.max(30, Math.min(height - 30, m.y));
  });

  // 更新 SVG
  const groups = nodeGroup.children;
  for (let i = 0; i < modules.length; i++) {
    groups[i].setAttribute("transform", `translate(${modules[i].x},${modules[i].y})`);
  }

  const lines = linkGroup.children;
  for (let i = 0; i < edges.length; i++) {
    const [src, tgt] = edges[i];
    const a = nodeMap[src], b = nodeMap[tgt];
    if (!a || !b) continue;
    lines[i].setAttribute("x1", a.x);
    lines[i].setAttribute("y1", a.y);
    lines[i].setAttribute("x2", b.x);
    lines[i].setAttribute("y2", b.y);
  }

  requestAnimationFrame(tick);
}
tick();

// ============================================================
// 侧边栏
// ============================================================
function showSidebar(m) {
  const sb = document.getElementById("sidebar");
  const content = document.getElementById("sidebar-content");

  // 找调用方和被调用方
  const callers = edges.filter(([s, t]) => t === m.id).map(([s]) => nodeMap[s]).filter(Boolean);
  const callees = edges.filter(([s, t]) => s === m.id).map(([, t]) => nodeMap[t]).filter(Boolean);

  let html = `
    <h2>${m.label}</h2>
    <div class="file">${m.file}</div>
    <div class="desc">${m.desc}</div>
    <div style="margin-top:8px"><span class="tag tag-${m.layer}">${m.layer.toUpperCase()}</span></div>
  `;

  if (callers.length > 0) {
    html += `<div class="deps"><h3>⬆ 调用方 (${callers.length})</h3>`;
    callers.forEach(c => {
      html += `<div class="dep-item" onclick="focusNode('${c.id}')">← ${c.label}</div>`;
    });
    html += `</div>`;
  }

  if (callees.length > 0) {
    html += `<div class="deps"><h3>⬇ 被调用 (${callees.length})</h3>`;
    callees.forEach(c => {
      html += `<div class="dep-item" onclick="focusNode('${c.id}')">→ ${c.label}</div>`;
    });
    html += `</div>`;
  }

  content.innerHTML = html;
  sb.classList.add("open");

  // 高亮相关节点
  highlightRelated(m.id);
}

function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  clearHighlight();
}

function focusNode(id) {
  const m = nodeMap[id];
  if (m) showSidebar(m);
}

// ============================================================
// 高亮
// ============================================================
function highlightRelated(id) {
  const related = new Set([id]);
  edges.forEach(([s, t]) => {
    if (s === id) related.add(t);
    if (t === id) related.add(s);
  });

  const groups = nodeGroup.children;
  for (let i = 0; i < modules.length; i++) {
    const g = groups[i];
    const m = modules[i];
    if (related.has(m.id)) {
      g.style.opacity = "1";
    } else {
      g.style.opacity = "0.15";
    }
  }

  const lines = linkGroup.children;
  for (let i = 0; i < edges.length; i++) {
    const [s, t] = edges[i];
    if (s === id || t === id) {
      lines[i].style.stroke = "#6366f1";
      lines[i].style.strokeOpacity = "0.8";
      lines[i].style.strokeWidth = "2";
    } else {
      lines[i].style.strokeOpacity = "0.05";
    }
  }
}

function clearHighlight() {
  Array.from(nodeGroup.children).forEach(g => g.style.opacity = "1");
  Array.from(linkGroup.children).forEach(l => {
    l.style.stroke = "#334155";
    l.style.strokeOpacity = "0.3";
    l.style.strokeWidth = "1";
  });
}

// ============================================================
// 搜索
// ============================================================
function filterNodes(query) {
  if (!query) { clearHighlight(); return; }
  query = query.toLowerCase();
  const matched = new Set();
  modules.forEach(m => {
    if (m.label.toLowerCase().includes(query) || m.file.toLowerCase().includes(query) || m.desc.toLowerCase().includes(query)) {
      matched.add(m.id);
    }
  });

  const groups = nodeGroup.children;
  for (let i = 0; i < modules.length; i++) {
    groups[i].style.opacity = matched.has(modules[i].id) ? "1" : "0.1";
  }
}

// 点击空白关闭侧边栏
svg.addEventListener("click", (e) => {
  if (e.target === svg) closeSidebar();
});
</script>
</body>
</html>
